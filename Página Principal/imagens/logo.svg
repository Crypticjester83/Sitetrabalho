<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Anel externo (verde escuro) representando união / comunidade -->
  <circle cx="100" cy="100" r="94" fill="#004409"/>
  <!-- Preenchimento interno (verde principal) -->
  <circle cx="100" cy="100" r="82" fill="#008612"/>

  <!-- Livro aberto (branco) - simboliza os cursos / conteúdo de qualidade -->
  <path d="M100,118
           C90,110 72,106 58,109
           L58,132
           C72,129 90,133 100,141
           C110,133 128,129 142,132
           L142,109
           C128,106 110,110 100,118
           Z"
        fill="#FFFFFF"/>
  <!-- Linha central da lombada do livro -->
  <line x1="100" y1="118" x2="100" y2="141" stroke="#008612" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Capelo de formatura (branco) - simboliza qualidade / conquista acadêmica -->
  <g>
    <!-- Base circular do capelo -->
    <ellipse cx="100" cy="82" rx="14" ry="8" fill="#FFFFFF"/>
    <!-- Tampo do capelo (losango) -->
    <polygon points="100,58 138,80 100,102 62,80" fill="#FFFFFF"/>
    <!-- Botão central -->
    <circle cx="100" cy="80" r="3.5" fill="#008612"/>
    <!-- Borla -->
    <line x1="132" y1="83" x2="132" y2="100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="132" cy="103" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
