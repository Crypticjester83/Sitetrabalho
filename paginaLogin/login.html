<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="icon" href="../imagens/logositepequeno.png">
    <link rel="stylesheet"
    type="text/css"
    href="login.css">
    <link rel="stylesheet"
    type="text/css"
    href="../geral.css">
    <link rel="stylesheet"
    type="text/css"
    href="geral-login.css">
</head>

<body>
    <header class="navegacao">
        <nav>
            <img src="../imagens/logosite.png" alt="logo-site.png" class="logo-cabecario">
            <ul class="menu"> <!--"menu é referente a lista de itens do cabeçario da pagina principal"-->
                <li class="item-menu"><a href="../paginaPrincipal/paginaprincipal.html">Página Principal</a></li>
                <li class="item-menu"><a href="../paginaArvoreCursos/arvore-cursos.html">Árvore de Aprendizagem</a></li>
                <li class="item-menu"><a href="../paginaCursos/cursos.html">Cursos</a></li>
                <li class="item-menu"><a href="../paginaCertificado/certificado.html">Peça seu Certificado</a></li>
                <li class="item-menu"><a href="../sobre/sobre.html">Sobre</a></li>
                <li class="item-menu"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="login">
            <h1>Entrar</h1>
            <form action="login.html" method="post" class="form-login">
                <label for="email">Email</label>
                <input type="text" name="email" placeholder="seuemail@conta.com" id="email" required>
                <label for="senha">Senha</label>
                <input type="password" name="senha" placeholder="Sua Senha" id="senha" required>
                <div class="linha">
                    <input type="checkbox" name="lembrar" id="lembrar" class="lembrar" checked>
                    <label for="lembrar" class="lembrar">Lembrar de Mim</label>
                </div>
                <button class="botao-login" type="submit">Entrar</button>
            </form>
            <div class="linha">
                <a href="recuperar_senha.html" id="botao-recuperar">Esqueci minha senha</a>
                <a href="cadastrar.html">Cadastrar</a>
            </div>
        </div>
    </main>
</body>
</html>
