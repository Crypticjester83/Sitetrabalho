<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>

    <link rel="icon" href="../imagens/logosite.png">
    <link rel="stylesheet"
    type="text/css"
    href="cadastrar.css">
    <link rel="stylesheet"
    type="text/css"
    href="../geral.css">
</head>

<body>
    <header class="navegacao">
        <nav>
            <img src="../imagens/logosite.png" alt="logo-site.png" class="logo-cabecario">
            <ul class="menu"> <!--"menu é referente a lista de itens do cabeçario da pagina principal"-->
                <li class="item-menu"><a href="../paginaPrincipal/paginaprincipal.html">Página Principal</a></li>
                <li class="item-menu"><a href="../paginaArvoreCursos/arvore-cursos.html">Árvore de Aprendizagem</a></li>
                <li class="item-menu"><a href="../paginaCursos/cursos.html">Cursos</a></li>
                <li class="item-menu"><a href="../paginaCertificado/certificado.html">Peça seu Certificado</a></li>
                <li class="item-menu"><a href="../sobre/sobre.html">Sobre</a></li>
                <li class="item-menu"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div id="cadastro">
            <img src="../imagens/logositemediano.png" alt="logo-site.png" id="logo-cadastrar">
            <h1>Cadastra-se agora</h1>
            <form action="cadastrar.html" method="post" id="cadastro-form">
                <label for="nome" class="texto-cadastro">Nome</label>
                <input id="nome" class="cadastro-input" type="text" name="nome" placeholder="Seu nome" required>
                <label for="sobrenome" class="texto-cadastro">Sobrenome</label>
                <input id="sobrenome" class="cadastro-input" type="text" name="sobrenome" placeholder="Seu sobrenome" required>
                <label for="email" class="texto-cadastro">Email</label>
                <input id="email" class="cadastro-input" type="text" name="email" placeholder="Seu email" required>
                <label for="confirmar-email" class="texto-cadastro">Confirme seu email</label>
                <input id="confirmar-email" class="cadastro-input" type="text" name="confirmar-email" placeholder="Confirme seu email" required>
                <label for="senha" class="texto-cadastro">Senha</label>
                <input id="senha" class="cadastro-input" type="password" name="senha" placeholder="Sua senha" required>
                <label for="confirmar-senha" class="texto-cadastro">Confirme sua senha</label>
                <input id="confirmar-senha" class="cadastro-input" type="password" name="confirmar-senha" placeholder="Confirme sua senha" required>
                <label for="telefone" class="texto-cadastro">Telefone</label>
                <input id="telefone" class="cadastro-input" type="text" name="telefone" placeholder="(00) 99999-9999" required>
                <label for="sexo" class="texto-cadastro">Sexo</label>
                <div class="linha">
                    <input id="sexo" class="cadastro-input" type="radio" name="sexo" value="Masculino" required>
                    <label for="sexo" class="texto-cadastro">Masculino</label>
                    <input id="sexo" class="cadastro-input" type="radio" name="sexo" value="Feminino" required>
                    <label for="sexo" class="texto-cadastro">Feminino</label>
                    <input id="sexo" class="cadastro-input" type="radio" name="sexo" value="Outros" required>   
                    <label for="sexo" class="texto-cadastro">Outros</label>
                </div>
                <button class="botao-cadastro" id="botao-cadastrar" type="submit">Cadastrar</button>
            </form>
        </div>
    </main>
</body>
</html>
