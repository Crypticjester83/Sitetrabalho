            <h1>Problemas na conta?</h1>
            <p>Insira seu email ou nome de usuário e clique em "Redefinir Senha" para receber um link para redefinir sua senha.</p>
            <form action="recuperar-senha.html" method="post" class="form-login" id="recuperar">

                <input type="text" name="email" placeholder="Nome de usuario ou email"  required>
                <div class="linha">
                    <button class="botao-login" type="submit">Redefinir Senha</button>
                </div>
            </form>
